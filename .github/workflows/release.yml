name: release

# Publishes to npm via OIDC trusted publishing — no NPM_TOKEN secret required.
#
# One-time setup on npmjs.com (after the first manual publish, because trusted
# publishing can only be configured on a package that already exists):
#   Package settings -> Trusted publisher -> GitHub Actions
#     Organization or user: ShadowFull12
#     Repository:           overhaul-ui
#     Workflow filename:    release.yml
#
# Then every `v*` tag publishes automatically.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  id-token: write        # required for trusted publishing

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      # trusted publishing needs npm >= 11.5.1
      - run: npm install -g npm@latest

      - name: Verify skill payload
        run: node bin/overhaul-ui.mjs verify

      - name: Check tag matches package version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$PKG" ]; then
            echo "tag $TAG does not match package.json $PKG"
            exit 1
          fi

      - name: Publish
        run: npm publish --access public
